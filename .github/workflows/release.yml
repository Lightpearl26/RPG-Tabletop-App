# Builds the installers and publishes a GitHub release when a version tag is pushed.
#
#   1. set __version__ in rpg_tabletop/__init__.py (e.g. "0.2.0") and commit
#   2. git tag v0.2.0 && git push origin v0.2.0
#
# The installed applications then offer the update at their next start.
# A tag with a suffix (v0.2.0-rc1) is published as a pre-release: the updater
# ignores it, which lets you test a build before offering it to everyone.
# "Run workflow" (manual run) builds the installers as an artifact, without a release.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .[dev]

      - name: Check version
        id: version
        shell: pwsh
        run: |
          $version = python -c "import rpg_tabletop; print(rpg_tabletop.__version__)"
          if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME -notmatch "^v$([regex]::Escape($version))(-.+)?$") {
            Write-Error "Tag $env:GITHUB_REF_NAME does not match __version__ $version"
            exit 1
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest

      - name: Executables
        run: |
          pyinstaller --noconfirm packaging/gm.spec
          pyinstaller --noconfirm packaging/player.spec

      - name: Installers
        shell: pwsh
        run: |
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          foreach ($app in "gm", "player") {
            & $iscc "/DApp=$app" "/DAppVersion=${{ steps.version.outputs.version }}" packaging/installer.iss
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }

      - name: Checksums
        shell: pwsh
        working-directory: dist/installers
        run: |
          Get-ChildItem -Filter *-Setup.exe | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          } | Set-Content -Encoding ascii SHA256SUMS.txt
          Get-Content SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: installers
          path: dist/installers/

      - name: GitHub release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $flags = @("--generate-notes", "--title", "RPG Tabletop $tag")
          if ($tag.Contains("-")) { $flags += "--prerelease" }
          gh release create $tag `
            dist/installers/RPGTabletop-Setup.exe `
            dist/installers/RPGTabletopPlayer-Setup.exe `
            dist/installers/SHA256SUMS.txt `
            @flags
