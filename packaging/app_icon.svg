<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <!-- background tile -->
    <radialGradient id="tile" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#3b2f1f"/>
      <stop offset="1" stop-color="#17120b"/>
    </radialGradient>
    <!-- glow behind the flask -->
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffd76a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffd76a" stop-opacity="0"/>
    </radialGradient>
    <!-- glass -->
    <radialGradient id="glass" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.7" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.18"/>
    </radialGradient>
    <!-- liquid -->
    <radialGradient id="liquid" cx="45%" cy="35%" r="75%">
      <stop offset="0" stop-color="#fff3b0"/>
      <stop offset="0.45" stop-color="#ffc93c"/>
      <stop offset="1" stop-color="#d9861a"/>
    </radialGradient>
    <linearGradient id="surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffbe0"/>
      <stop offset="1" stop-color="#ffd860"/>
    </linearGradient>
    <!-- cork -->
    <linearGradient id="cork" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9a6a37"/>
      <stop offset="0.45" stop-color="#d9a566"/>
      <stop offset="1" stop-color="#8a5c2e"/>
    </linearGradient>
    <linearGradient id="neck" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="0.35" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.08"/>
    </linearGradient>
    <clipPath id="body">
      <circle cx="128" cy="154" r="80"/>
    </clipPath>
  </defs>

  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#tile)"/>
  <circle cx="128" cy="150" r="112" fill="url(#halo)"/>

  <!-- neck -->
  <path d="M106 64 h44 v20 q0 6 6 10 l-56 0 q6 -4 6 -10 z" fill="#2a2418" opacity="0.6"/>
  <rect x="104" y="58" width="48" height="36" rx="6" fill="url(#neck)" stroke="#e8dcc0" stroke-opacity="0.55" stroke-width="3"/>
  <!-- rim -->
  <rect x="96" y="54" width="64" height="12" rx="6" fill="#e9dcbf" opacity="0.85"/>

  <!-- cork -->
  <path d="M104 22 h48 q6 0 6 6 v30 h-60 v-30 q0 -6 6 -6 z" fill="url(#cork)" stroke="#5c3b1b" stroke-width="3"/>
  <ellipse cx="128" cy="24" rx="27" ry="7" fill="#e7bb80" stroke="#5c3b1b" stroke-width="2.5"/>
  <circle cx="114" cy="38" r="3" fill="#6b4422"/>
  <circle cx="132" cy="44" r="2.5" fill="#6b4422"/>
  <circle cx="145" cy="34" r="2" fill="#6b4422"/>
  <circle cx="122" cy="50" r="2" fill="#6b4422"/>

  <!-- liquid, inside the round body -->
  <g clip-path="url(#body)">
    <rect x="40" y="132" width="176" height="110" fill="url(#liquid)"/>
    <ellipse cx="128" cy="132" rx="78" ry="12" fill="url(#surface)"/>
    <!-- bubbles -->
    <circle cx="96" cy="176" r="7" fill="#fffbe6" opacity="0.75"/>
    <circle cx="150" cy="190" r="5" fill="#fffbe6" opacity="0.7"/>
    <circle cx="124" cy="160" r="4" fill="#fffbe6" opacity="0.8"/>
    <circle cx="170" cy="160" r="3.5" fill="#fffbe6" opacity="0.7"/>
    <circle cx="110" cy="206" r="3" fill="#fffbe6" opacity="0.6"/>
    <circle cx="80" cy="150" r="2.5" fill="#fffbe6" opacity="0.7"/>
    <!-- sparkles rising above the liquid -->
    <circle cx="104" cy="112" r="2.5" fill="#fff3b8" opacity="0.8"/>
    <circle cx="140" cy="102" r="2" fill="#fff3b8" opacity="0.7"/>
    <circle cx="158" cy="118" r="2.5" fill="#fff3b8" opacity="0.75"/>
    <circle cx="120" cy="96" r="1.8" fill="#fff3b8" opacity="0.6"/>
  </g>

  <!-- glass body -->
  <circle cx="128" cy="154" r="80" fill="url(#glass)" stroke="#efe4c8" stroke-opacity="0.7" stroke-width="4"/>
  <!-- highlights -->
  <path d="M78 122 a58 58 0 0 1 40 -38" fill="none" stroke="#ffffff" stroke-opacity="0.85" stroke-width="9" stroke-linecap="round"/>
  <circle cx="74" cy="142" r="5" fill="#ffffff" opacity="0.8"/>
  <path d="M186 186 a66 66 0 0 1 -28 34" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="5" stroke-linecap="round"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
